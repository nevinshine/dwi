<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DWI — Rewards Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020202;
            --card-bg: #0a0a0a;
            --border: rgba(255,255,255,0.06);
            --text: #ffffff;
            --muted: #666;
            --neon: #ccff00;
            --neon-glow: rgba(204,255,0,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 24px;
            -webkit-font-smoothing: antialiased;
            overflow-y: auto;
        }

        .page { max-width: 820px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 36px;
        }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
        .logo-dot { width: 8px; height: 8px; background: var(--neon); border-radius: 50%; }
        .back-link { font-size: 0.82rem; color: var(--muted); cursor: pointer; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: var(--text); }

        .page-title { font-size: 2.2rem; font-weight: 800; letter-spacing: -1.5px; text-align: center; margin-bottom: 6px; }
        .page-desc { font-size: 0.9rem; color: var(--muted); text-align: center; margin-bottom: 10px; }

        .balance-pill {
            display: flex; justify-content: center; margin-bottom: 36px;
        }
        .balance-pill span {
            background: rgba(204,255,0,0.06); border: 1px solid rgba(204,255,0,0.12);
            padding: 6px 18px; border-radius: 99px; font-size: 0.82rem; color: var(--neon); font-weight: 600;
        }

        /* Gift Card Grid */
        .cards-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 36px;
        }

        /* 3D Card Wrapper */
        .card-wrapper {
            perspective: 800px;
        }

        .gift-card {
            position: relative;
            width: 100%;
            aspect-ratio: 1.6 / 1;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            transform-style: preserve-3d;
            transform: rotateX(2deg) rotateY(-2deg);
        }

        .gift-card:hover {
            transform: rotateX(5deg) rotateY(-5deg) translateY(-6px) scale(1.02);
        }

        /* Card faces */
        .card-face {
            position: absolute; inset: 0;
            border-radius: 16px;
            padding: 24px;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Shine overlay */
        .card-shine {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
            border-radius: 16px;
            pointer-events: none;
            z-index: 2;
        }

        .card-edge {
            position: absolute; inset: 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            pointer-events: none;
            z-index: 3;
        }

        /* Apple */
        .card-apple .card-face {
            background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
        }
        .card-apple:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 60px rgba(255,255,255,0.03); }
        .card-apple .card-brand { font-size: 1.8rem; }
        .card-apple .card-label { color: #a1a1a1; }
        .card-apple .card-amount { color: #fff; }

        /* Amazon */
        .card-amazon .card-face {
            background: linear-gradient(145deg, #232f3e 0%, #131920 100%);
        }
        .card-amazon:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 40px rgba(255,153,0,0.08); }
        .card-amazon .card-brand { color: #ff9900; }
        .card-amazon .card-label { color: #8899aa; }
        .card-amazon .card-amount { color: #ff9900; }

        /* Steam */
        .card-steam .card-face {
            background: linear-gradient(145deg, #1b2838 0%, #0e1621 100%);
        }
        .card-steam:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 40px rgba(102,192,244,0.08); }
        .card-steam .card-brand { color: #66c0f4; }
        .card-steam .card-label { color: #8b9baa; }
        .card-steam .card-amount { color: #66c0f4; }

        /* Spotify */
        .card-spotify .card-face {
            background: linear-gradient(145deg, #191414 0%, #0a0a0a 100%);
        }
        .card-spotify:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 40px rgba(30,215,96,0.08); }
        .card-spotify .card-brand { color: #1ed760; }
        .card-spotify .card-label { color: #888; }
        .card-spotify .card-amount { color: #1ed760; }

        /* Brand logo watermark */
        .card-logo {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 80px;
            object-fit: contain;
            opacity: 0.12;
            pointer-events: none;
            z-index: 1;
            filter: brightness(1.5);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .gift-card:hover .card-logo {
            opacity: 0.2;
            transform: translateY(-50%) scale(1.08);
        }
        .card-apple .card-logo { filter: brightness(2); }
        .card-amazon .card-logo { filter: brightness(1.5) saturate(1.2); }
        .card-steam .card-logo { filter: brightness(1.5) saturate(1.3); }
        .card-spotify .card-logo { filter: brightness(1.5) saturate(1.4); }

        /* Card content */
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 4; }
        .card-brand { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; }
        .card-badge {
            font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
            padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5);
        }
        .card-bottom { position: relative; z-index: 4; }
        .card-amount { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
        .card-label { font-size: 0.72rem; font-weight: 500; margin-top: 2px; }
        .card-cost {
            display: inline-flex; align-items: center; gap: 4px; margin-top: 6px;
            font-size: 0.68rem; font-weight: 600; color: var(--neon);
            background: rgba(204,255,0,0.08); padding: 3px 10px; border-radius: 99px;
        }

        /* Redeem section below card */
        .card-action {
            margin-top: 10px; text-align: center;
        }
        .redeem-btn {
            width: 100%; padding: 11px; border: none; border-radius: 99px;
            font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s ease;
            background: var(--neon); color: #000;
        }
        .redeem-btn:hover { box-shadow: 0 0 30px var(--neon-glow); transform: translateY(-1px); }
        .redeem-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; transform: none; }
        .redeem-btn.locked { background: rgba(255,255,255,0.06); color: var(--muted); }

        /* Success Overlay */
        .overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.94);
            flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; padding: 40px;
        }
        .overlay.visible { display: flex; }
        .success-icon { font-size: 3rem; animation: pop 0.5s ease; }
        .success-title { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
        .success-code {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 14px 28px;
            font-size: 1.2rem; font-weight: 700; color: var(--neon); letter-spacing: 2px;
        }
        .success-detail { font-size: 0.85rem; color: var(--muted); text-align: center; line-height: 1.6; }
        .success-detail strong { color: var(--neon); }
        .close-btn {
            padding: 10px 24px; background: transparent; border: 1px solid var(--border);
            color: var(--text); border-radius: 99px; font-family: 'Inter', sans-serif;
            font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.05); }

        @keyframes pop {
            0% { transform: scale(0); } 50% { transform: scale(1.3); } 100% { transform: scale(1); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-wrapper { animation: fadeUp 0.5s ease both; }
        .card-wrapper:nth-child(2) { animation-delay: 0.08s; }
        .card-wrapper:nth-child(3) { animation-delay: 0.16s; }
        .card-wrapper:nth-child(4) { animation-delay: 0.24s; }

        /* 3D tilt on mouse */
        .gift-card.tilting {
            transition: none;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="logo"><span class="logo-dot"></span> DWI Rewards</div>
            <a class="back-link" onclick="window.location.href='index.html'">← Dashboard</a>
        </div>

        <h1 class="page-title">Redeem Gift Cards</h1>
        <p class="page-desc">Turn your eco-impact into real rewards.</p>
        <div class="balance-pill"><span id="bal">Loading...</span></div>

        <div class="cards-grid">
            <!-- Apple -->
            <div class="card-wrapper">
                <div class="gift-card card-apple" data-type="giftcard" data-name="Apple" onmousemove="tilt(event, this)" onmouseleave="untilt(this)">
                    <div class="card-face">
                        <div class="card-top">
                            <span class="card-brand"></span>
                            <span class="card-badge">Gift Card</span>
                        </div>
                        <div class="card-bottom">
                            <div class="card-amount">€5</div>
                            <div class="card-label">Apple Gift Card</div>
                            <div class="card-cost">5 EC</div>
                        </div>
                    </div>
                    <img class="card-logo" src="assets/apple-logo.png" alt="Apple" />
                    <div class="card-shine"></div>
                    <div class="card-edge"></div>
                </div>
                <div class="card-action">
                    <button class="redeem-btn" id="btn-apple" onclick="redeem('giftcard','Apple',this)">Redeem Apple Card</button>
                </div>
            </div>

            <!-- Amazon -->
            <div class="card-wrapper">
                <div class="gift-card card-amazon" data-type="giftcard" data-name="Amazon" onmousemove="tilt(event, this)" onmouseleave="untilt(this)">
                    <div class="card-face">
                        <div class="card-top">
                            <span class="card-brand">amazon</span>
                            <span class="card-badge">Gift Card</span>
                        </div>
                        <div class="card-bottom">
                            <div class="card-amount">€5</div>
                            <div class="card-label">Amazon Gift Card</div>
                            <div class="card-cost">5 EC</div>
                        </div>
                    </div>
                    <img class="card-logo" src="assets/amazon-logo.png" alt="Amazon" />
                    <div class="card-shine"></div>
                    <div class="card-edge"></div>
                </div>
                <div class="card-action">
                    <button class="redeem-btn" id="btn-amazon" onclick="redeem('giftcard','Amazon',this)">Redeem Amazon Card</button>
                </div>
            </div>

            <!-- Steam -->
            <div class="card-wrapper">
                <div class="gift-card card-steam" data-type="giftcard" data-name="Steam" onmousemove="tilt(event, this)" onmouseleave="untilt(this)">
                    <div class="card-face">
                        <div class="card-top">
                            <span class="card-brand">STEAM</span>
                            <span class="card-badge">Gift Card</span>
                        </div>
                        <div class="card-bottom">
                            <div class="card-amount">€5</div>
                            <div class="card-label">Steam Wallet Code</div>
                            <div class="card-cost">5 EC</div>
                        </div>
                    </div>
                    <img class="card-logo" src="assets/steam-logo.png" alt="Steam" />
                    <div class="card-shine"></div>
                    <div class="card-edge"></div>
                </div>
                <div class="card-action">
                    <button class="redeem-btn" id="btn-steam" onclick="redeem('giftcard','Steam',this)">Redeem Steam Card</button>
                </div>
            </div>

            <!-- Spotify -->
            <div class="card-wrapper">
                <div class="gift-card card-spotify" data-type="giftcard" data-name="Spotify" onmousemove="tilt(event, this)" onmouseleave="untilt(this)">
                    <div class="card-face">
                        <div class="card-top">
                            <span class="card-brand">Spotify</span>
                            <span class="card-badge">Premium</span>
                        </div>
                        <div class="card-bottom">
                            <div class="card-amount">€5</div>
                            <div class="card-label">Spotify Premium Card</div>
                            <div class="card-cost">5 EC</div>
                        </div>
                    </div>
                    <img class="card-logo" src="assets/spotify-logo.png" alt="Spotify" />
                    <div class="card-shine"></div>
                    <div class="card-edge"></div>
                </div>
                <div class="card-action">
                    <button class="redeem-btn" id="btn-spotify" onclick="redeem('giftcard','Spotify',this)">Redeem Spotify Card</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Success -->
    <div class="overlay" id="overlay">
        <div class="success-icon" id="s-icon">🎁</div>
        <h2 class="success-title" id="s-title">Gift Card Redeemed!</h2>
        <div class="success-code" id="s-code">GC-XXXXXXXX</div>
        <p class="success-detail" id="s-detail"></p>
        <button class="close-btn" onclick="window.location.href='index.html'">← Back to Dashboard</button>
    </div>

    <script>
        const { invoke } = window.__TAURI__.core;

        // 3D tilt effect
        function tilt(e, el) {
            const rect = el.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            el.classList.add('tilting');
            el.style.transform = `rotateY(${x * 20}deg) rotateX(${-y * 20}deg) scale(1.03)`;
        }
        function untilt(el) {
            el.classList.remove('tilting');
            el.style.transform = '';
        }

        // Load balance
        async function init() {
            try {
                const st = await invoke('get_wallet_status');
                document.getElementById('bal').textContent = st.balance.toFixed(1) + ' EC';
                document.querySelectorAll('.redeem-btn').forEach(btn => {
                    if (st.balance < 5) {
                        btn.classList.add('locked');
                        btn.textContent = `Need ${(5 - st.balance).toFixed(0)} more EC`;
                        btn.disabled = true;
                    }
                });
            } catch(e) {
                document.getElementById('bal').textContent = 'Error';
            }
        }

        async function redeem(type, name, btn) {
            btn.disabled = true;
            btn.textContent = 'Processing...';
            try {
                const r = await invoke('redeem_credits', { rewardType: type });
                if (r.success) {
                    document.getElementById('s-title').textContent = name + ' Card Redeemed!';
                    document.getElementById('s-code').textContent = r.code;
                    document.getElementById('s-detail').innerHTML =
                        `Your <strong>${name} €5 Gift Card</strong> code is ready.<br>New balance: <strong>${r.new_balance.toFixed(1)}</strong> EC`;
                    document.getElementById('overlay').classList.add('visible');
                } else {
                    btn.textContent = r.message;
                    setTimeout(() => { btn.textContent = `Redeem ${name} Card`; btn.disabled = false; }, 3000);
                }
            } catch(e) {
                btn.textContent = '❌ ' + e;
                setTimeout(() => { btn.textContent = `Redeem ${name} Card`; btn.disabled = false; }, 3000);
            }
        }

        init();
    </script>
</body>
</html>
